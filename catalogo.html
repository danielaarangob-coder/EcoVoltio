<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo · EcoVoltio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/tienda.js" defer></script>
</head>
<body class="container py-3">
    <header class="encabezado">
        <h1>Catálogo de Productos</h1>
        <p>Calcula tu ahorro estimado con una tarifa base de 950 COP/kWh.</p>
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <!-- Buscador por nombre -->
        <div class="mb-3">
            <label for="buscador" class="form-label fw-bold">Buscar producto:</label>
            <input type="text" id="buscador" class="form-control" placeholder="Escribe el nombre del equipo...">
        </div>

        <!-- Filtros por categoría -->
        <div class="filtros">
            <button class="filtro activo" data-categoria="todas">Todas</button>
            <button class="filtro" data-categoria="iluminacion">Iluminación</button>
            <button class="filtro" data-categoria="electrodomesticos">Electrodomésticos</button>
            <button class="filtro" data-categoria="solar">Energía solar</button>
        </div>

        <!-- Rejilla principal: Productos + Carrito -->
        <div class="catalogo">
            <div id="productos" class="tarjetas"></div>

            <aside id="carrito">
                <h2>Carrito de Compras</h2>
                <ul id="lista-carrito"></ul>
                <p id="total">Total: $0</p>
                <p id="ahorro">El carrito está vacío.</p>
                <button id="vaciar" class="btn btn-outline-secondary btn-sm w-100">Vaciar carrito</button>
            </aside>
        </div>
    </main>

    <footer class="pie">
        <p>Ingeniería Web I · IU Digital de Antioquia · 2026-2</p>
    </footer>
</body>
</html>
