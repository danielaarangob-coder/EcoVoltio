<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto · EcoVoltio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="container py-3">
    <header class="encabezado">
        <h1>Contáctanos</h1>
        <p>¿Tienes dudas sobre la eficiencia de algún equipo? Escríbenos.</p>
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <form class="formulario p-4 bg-white rounded-3 shadow-sm">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo:</label>
                <input type="text" id="nombre" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico:</label>
                <input type="email" id="correo" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono de contacto:</label>
                <input type="tel" id="telefono" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="categoria-interes" class="form-label">Categoría de interés:</label>
                <select id="categoria-interes" class="form-select">
                    <option value="iluminacion">Iluminación LED</option>
                    <option value="electrodomesticos">Electrodomésticos Inverter</option>
                    <option value="solar">Energía Solar</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje o consulta:</label>
                <textarea id="mensaje" class="form-control" rows="4" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">Enviar mensaje</button>
        </form>
    </main>

    <footer class="pie">
        <p>Ingeniería Web I · IU Digital de Antioquia · 2026-2</p>
    </footer>
</body>
</html>
